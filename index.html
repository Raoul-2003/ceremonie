<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soutarah Vehicle Showcase Test</title>
    <link rel="stylesheet" href="css/style.css" />
    <script>
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'css/vehicles.css?v=' + new Date().getTime();
      document.head.appendChild(link);
    </script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; background: #000; }
      .application { display: none; }
    </style>
  </head>
  <body>
    <!-- Dummy application to satisfy the showcase code hiding it -->
    <main class="application"></main>
    <audio id="bg-music" src="images/2.mp3" autoplay loop preload="auto"></audio>

    <!-- Configure dummy config and immediately trigger the showcase -->
    <script>
      const CONFIG = {
        evenement: "2020-01-01T00:00:00" // Always in the past so it triggers immediately
      };
    </script>
    <script>
      // Load vehicles.js with cache busting
      const script = document.createElement('script');
      script.src = "js/vehicles.js?v=" + new Date().getTime();
      script.onload = () => {
        if (window._vpLaunch) {
          window._vpLaunch();
        }
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
